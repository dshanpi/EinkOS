name: EinkOS documentation

on:
  push:
    branches: [main]
    paths: ['docs/**', 'README.md', 'scripts/check_docs.py', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'README.md', 'scripts/check_docs.py', '.github/workflows/docs.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the site after a successful build
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check repository documentation and screenshot provenance
        run: python3 scripts/check_docs.py
      - name: Install, build, check and upload the site
        uses: withastro/action@v6
        with:
          path: docs
          node-version: 24
          package-manager: npm@11.6.2

  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.deploy) ||
       (github.event_name == 'push' && vars.DOCS_PAGES_ENABLED == 'true'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5
